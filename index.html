<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация клиента</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Новая запись</h1>

        <form id="appointmentForm">

            <div class="input-group">
                <label for="client">Клиент</label>
                <input type="text" id="client" placeholder="Введите имя клиента">
            </div>

            <div class="input-group">
                <label for="master">Мастер</label>

                <select id="master">
                    <option value="">Выберите мастера</option>
                    <option>Ольга</option>
                    <option>Мария</option>
                    <option>Екатерина</option>
                </select>
            </div>

            <div class="input-group">
                <label for="service">Услуга</label>

                <select id="service">
                    <option value="">Выберите услугу</option>
                    <option>Маникюр</option>
                    <option>Педикюр</option>
                    <option>Наращивание</option>
                    <option>Коррекция</option>
                </select>
            </div>

            <div class="input-group">
                <label for="date">Дата</label>
                <input type="date" id="date">
            </div>

            <div class="input-group">
                <label for="time">Время</label>
                <input type="time" id="time">
            </div>

            <div class="input-group">
                <label for="price">Стоимость</label>
                <input type="number" id="price" placeholder="Введите стоимость">
            </div>

            <button type="submit">
                Создать запись
            </button>

        </form>
    </div>

    <div class="appointments">

        <h2>Записи клиентов</h2>

        <div id="appointmentsList">

            <!-- Здесь JavaScript будет создавать карточки -->
            <table>
                <thead>
                    <tr>
                        <th>Клиент</th>
                        <th>Услуга</th>
                        <th>Мастер</th>
                        <th>Дата</th>
                        <th>Время</th>
                        <th>Цена</th>
                    </tr>
                </thead>

                <tbody>

                </tbody>
            </table>
        </div>

    </div>
    <script type="module" src="./js/main.js"></script>

</body>

</html>
